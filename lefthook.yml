# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Validate content before committing
pre-commit:
  jobs:
    - name: ultracite
      run: pnpm --filter @celia/web exec ultracite fix --type-aware --type-check
      glob:
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.json'
        - '**/*.jsonc'
        - '**/*.css'
      stage_fixed: true
    - name: knip
      run: pnpm run check:deps
      glob: '*'
